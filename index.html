<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Item Purchase Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ff6a00, #ee0979);
      color: white;
      padding: 30px;
    }
    h1 {
      text-align: center;
    }
    .form-container {
      max-width: 400px;
      margin: auto;
      background: rgba(0, 0, 0, 0.2);
      padding: 20px;
      border-radius: 10px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }
    button {
      background-color: #fff;
      color: #ff6a00;
      font-weight: bold;
    }
    #result {
      text-align: center;
      font-size: 1.2em;
      margin-top: 20px;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Predict Item Purchased</h1>
  <div class="form-container">
    <form id="predictForm">
      <label>Age:</label>
      <input type="number" id="age" required>

      <label>Gender:</label>
      <select id="gender">
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>Category:</label>
      <select id="category">
        <option>Clothing</option>
        <option>Footwear</option>
        <option>Accessories</option>
      </select>

      <label>Size:</label>
      <select id="size">
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
      </select>

      <label>Season:</label>
      <select id="season">
        <option>Summer</option>
        <option>Winter</option>
        <option>Spring</option>
        <option>Fall</option>
      </select>

      <button type="submit">Predict</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById("predictForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = {
        Age: document.getElementById("age").value,
        Gender: document.getElementById("gender").value,
        Category: document.getElementById("category").value,
        Size: document.getElementById("size").value,
        Season: document.getElementById("season").value,
      };

      const response = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      document.getElementById("result").textContent = result["Predicted Item"] 
        ? "Predicted Item: " + result["Predicted Item"] 
        : "Error: " + result.error;
    });
  </script>
</body>
</html>
